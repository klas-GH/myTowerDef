<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>myTowerDef</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>myTowerDef</h1>
        <p>LEVEL 01 · FIRST DEFENSE · v1.3.0</p>
      </div>
      <div class="stats">
        <span>💰 <b id="coins">60</b></span>
        <span>❤️ <b id="lives">10</b></span>
      </div>
    </header>

    <div id="status" class="status">Build your defense!</div>
    <div id="wavePanel" class="wave-panel">
      <div id="waveInfo" class="wave-info">Wave: 1/3 (Pending)</div>
      <div id="nextWaveInfo" class="next-wave-info">Next: Wave 1 (8 enemies)</div>
    </div>

    <canvas id="game" aria-label="Tower defense game" width="300" height="360"></canvas>

    <section id="upgradePanel" class="upgrade-panel" aria-live="polite">
      <div class="upgrade-header">
        <h2 id="towerTitle">No tower selected</h2>
        <span id="towerLevel" class="level-pill"></span>
      </div>
      <div class="upgrade-stats">
        <div class="stat">
          <span class="label">Damage</span>
          <span class="value"><span id="curDamage">-</span> → <span id="nextDamage">-</span></span>
        </div>
        <div class="stat">
          <span class="label">Range</span>
          <span class="value"><span id="curRange">-</span> → <span id="nextRange">-</span></span>
        </div>
        <div class="stat">
          <span class="label">Cooldown</span>
          <span class="value"><span id="curCooldown">-</span>s → <span id="nextCooldown">-</span>s</span>
        </div>
        <div class="stat">
          <span class="label">Next Cost</span>
          <span class="value" id="nextCost">-</span>
        </div>
      </div>
      <button id="upgradeBtn" disabled>⬆ Upgrade</button>
      <div id="upgradeMsg" class="upgrade-msg"></div>
    </section>

    <section class="controls">
      <button id="buildBtn" disabled>🗼 Build · 50</button>
      <button id="startBtn" disabled>▶ Start Wave</button>
      <button id="restartBtn" class="secondary">↻ Restart</button>
    </section>

    <p class="hint">
      Build a tower on a green spot, then start the wave.
      Defend your base!
    </p>
  </main>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
