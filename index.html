<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>myTowerDef</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>myTowerDef</h1>
        <p>LEVEL 01 · FIRST DEFENSE</p>
      </div>
      <div class="stats">
        <span>💰 <b id="coins">60</b></span>
        <span>❤️ <b id="lives">10</b></span>
      </div>
    </header>

    <div id="status" class="status">🏆 Level 1 complete! +30 coins</div>

    <canvas id="game" aria-label="Tower defense game" width="300" height="360"></canvas>

    <section class="controls">
      <button id="buildBtn" disabled>🗼 Build · 50</button>
      <button id="startBtn" disabled>⚔ Wave in progress</button>
      <button id="restartBtn" class="secondary">↻ Restart</button>
    </section>

    <p class="hint">
      Build a tower on a green spot, then start the wave.
      Defend your base!
    </p>
  </main>

  <script src="game.js"></script>


</body>
</html>
